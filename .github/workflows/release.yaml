name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist, e.g. v0.0.1)"
        required: true
        type: string

permissions:
  contents: write

env:
  GO_VERSION: "1.26.0"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Resolve version
        id: version
        run: echo "version=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # Reproducibility: -trimpath drops local filesystem paths, and the version
      # is stamped so a released binary can identify itself via --version.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="crossplane-postrender_${{ steps.version.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags "-s -w -X github.com/jcogilvie/crossplane-helm-postrender/internal/version.version=${{ steps.version.outputs.version }}" \
            -o "dist/${name}/crossplane-postrender" \
            ./cmd/crossplane-postrender
          cp LICENSE README.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"

      # Per-artifact sums are merged into one checksums.txt in the release job, so
      # consumers can verify a download with a single file.
      - name: Checksum
        run: |
          cd dist
          sha256sum ./*.tar.gz > "checksums_${{ matrix.goos }}_${{ matrix.goarch }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: staging
          pattern: dist-*
          merge-multiple: true

      - name: Assemble checksums
        run: |
          mkdir -p dist
          mv staging/*.tar.gz dist/
          cat staging/checksums_*.txt | sed 's|\./||' | sort -k2 > dist/checksums.txt
          echo "Release contents:"
          ls -la dist/
          echo
          cat dist/checksums.txt

      # Attach the artifacts to the release, creating it only if it does not
      # already exist.
      #
      # Both orderings have to work, because either can happen:
      #
      #   - Cutting a release in the GitHub UI creates the tag *and* the release
      #     object, and the resulting tag push triggers this workflow. The release
      #     already exists by the time we get here, so `gh release create` fails
      #     with "a release with the same tag name already exists" -- and the
      #     built binaries never get attached, leaving a release with no assets.
      #   - Pushing a bare tag (`git push origin v1.2.3`) triggers this workflow
      #     with no release object, so one has to be created.
      #
      # Upload-if-present, create-if-absent handles both, and makes re-running the
      # job safe: `--clobber` replaces assets rather than failing on a name that
      # is already there.
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $VERSION exists; uploading artifacts to it."
            gh release upload "$VERSION" \
              --repo "${{ github.repository }}" \
              --clobber \
              dist/*
          else
            # --verify-tag refuses to invent a tag that does not exist, so a
            # mistyped workflow_dispatch input fails loudly rather than publishing
            # something odd. --generate-notes builds the changelog from merged PRs.
            echo "Release $VERSION does not exist; creating it."
            gh release create "$VERSION" \
              --repo "${{ github.repository }}" \
              --title "$VERSION" \
              --generate-notes \
              --verify-tag \
              dist/*
          fi

          echo "Assets now attached to $VERSION:"
          gh release view "$VERSION" --repo "${{ github.repository }}" \
            --json assets --jq '.assets[].name'
