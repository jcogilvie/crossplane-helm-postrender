name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # Kept in step with go.mod. Bump both together.
  GO_VERSION: "1.26.0"
  GOLANGCI_LINT_VERSION: "v2.13.1"

concurrency:
  # Supersede in-flight runs for the same ref, except on main where every commit
  # should get its own recorded result.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # v7 or newer is required: v6 rejects golangci-lint v2 version strings
      # outright ("golangci-lint v2 is not supported by golangci-lint-action v6").
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          # The action caches on its own; setup-go already primed the module cache.
          skip-cache: true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # A stale go.mod/go.sum is a real failure mode for a module with this many
      # transitive dependencies, so check it rather than let a later step paper
      # over it.
      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code --name-only go.mod go.sum || {
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' and commit the result."
            exit 1
          }

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l -s .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      # -race because the batch renderer runs stages concurrently; a data race
      # there would otherwise only show up under load.
      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  # Proves the release build works on every supported platform before a tag is
  # cut, rather than discovering a cross-compilation problem during a release.
  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o /dev/null ./cmd/crossplane-render
